name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lightweight database request
        env:
          SUPABASE_URL: https://tcvlffipaxrxvlmaliaq.supabase.co
          SUPABASE_KEY: sb_publishable_Nno92kn3tJq0GTcfLqYQjg_7_3YJG4b
        run: |
          # Calls a public RPC with a dummy token. The database runs the lookup
          # and answers "bad_token" (HTTP 400), which proves the DB is awake.
          code=$(curl -sS -m 30 -o resp.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/parent_login" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive-ping"}')
          echo "HTTP $code"
          cat resp.txt; echo
          if [ "$code" = "200" ] || grep -q "bad_token" resp.txt; then
            echo "Database responded. Keep-alive OK."
          else
            echo "Unexpected response"; exit 1
          fi
