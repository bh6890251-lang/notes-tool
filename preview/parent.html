<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تقرير الحلقة</title><meta name="theme-color" content="#1f6b4a"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="../favicon.ico"><link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root{--g:#1f6b4a;--gd:#0f4d35;--gl:#e4f1ea;--au:#d9a21b;--aud:#7a5a0a;--bg:#f4f1e8;--cd:#fff;--tx:#1d2b24;--mu:#55655c;--bd:#d8d2bf;--rd:#b3261e;--rdl:#fbe9e7;--ok:#17733a;--sh:0 1px 3px rgba(0,0,0,.12);--ft:Tahoma,"Segoe UI",system-ui,-apple-system,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--g:#5fc08f;--gd:#0b1612;--gl:#1d3a2c;--au:#e8b73c;--aud:#f0cf7a;--bg:#101714;--cd:#19231e;--tx:#e8efe9;--mu:#a7b8ad;--bd:#33443b;--rd:#ff8a80;--rdl:#3a1f1c;--ok:#6fd49a;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--ft);direction:rtl;padding-bottom:40px}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--au);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:0 12px}
header{display:flex;align-items:center;gap:10px;padding:12px 4px 6px}
header img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#fff;padding:2px}
header b{display:block;font-size:17px;line-height:1.3}
header small{color:var(--mu);font-size:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;box-shadow:var(--sh)}
.card h3{margin:0 0 6px;font-size:17px}
.mu{color:var(--mu);font-size:14px}
.btn{min-height:44px;min-width:44px;padding:8px 14px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
@media(prefers-color-scheme:dark){.btn{color:#06210f}}
.btn.s{background:var(--gl);color:var(--g);border:1px solid var(--bd)}
.btn[disabled]{opacity:.45;cursor:default}
.nav{display:flex;align-items:center;gap:8px;margin:8px 0}
.nav .mid{flex:1;text-align:center;font-weight:700}
.nav .mid small{display:block;color:var(--mu);font-weight:400;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chip{flex:none;min-height:44px;padding:6px 16px;border-radius:22px;border:1px solid var(--bd);background:var(--cd);font-weight:600;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
@media(prefers-color-scheme:dark){.chip.on{color:#06210f}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--gl);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--g)}
.stat span{font-size:13px;color:var(--mu)}
.bar{height:12px;border-radius:6px;background:var(--gl);overflow:hidden;margin:6px 0;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:var(--g)}
.day{border-top:1px solid var(--bd);padding:10px 0}
.day:first-of-type{border-top:0}
.dh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700;background:var(--gl);color:var(--g)}
.tag.bad{background:var(--rdl);color:var(--rd)}
.tag.neu{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.it{margin:4px 0;padding-inline-start:12px;border-inline-start:3px solid var(--au)}
.note{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:15px;white-space:pre-wrap}
.react{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.heart{border:1px solid var(--bd);background:var(--cd);border-radius:22px;min-height:44px;padding:6px 14px;cursor:pointer;font-weight:700}
.heart.on{background:var(--rdl);border-color:var(--rd);color:var(--rd)}
.cm{width:100%;min-height:72px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);font-size:16px;resize:vertical;margin-top:6px}
.sent{margin-top:6px;font-size:14px;color:var(--ok)}
.err{background:var(--rdl);color:var(--rd);border:1px solid var(--rd);border-radius:12px;padding:12px;margin:14px 0}
.toast{position:fixed;bottom:16px;inset-inline:16px;max-width:560px;margin:auto;background:var(--gd);color:#fff;padding:10px 14px;border-radius:12px;text-align:center;z-index:9}
.hid{display:none}
.ctr{text-align:center;padding:30px 0}
</style></head><body><div id="app"><header><img src="../icon-192.png" alt=""><div><b id="ttl">تقرير الحلقة</b><small id="sub"></small></div></header><div id="main"><div class="ctr mu">جاري التحميل...</div></div></div><div id="tt" class="toast hid" role="status"></div>
<script>
"use strict";
const URL_="https://tcvlffipaxrxvlmaliaq.supabase.co",KEY="sb_publishable_Nno92kn3tJq0GTcfLqYQjg_7_3YJG4b";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AR="٠١٢٣٤٥٦٧٨٩";const nm=n=>String(n).replace(/\d/g,d=>AR[d]);
const MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAY=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const TOKEN=(()=>{const m=/(?:^#|&)k=([^&]+)/.exec(location.hash);return m?decodeURIComponent(m[1]).trim():""})();
let ST={parent:"",kids:[],sid:null,week:null,reps:[],busy:false,err:""};
function pd(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function fd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dl(s){const d=pd(s);return nm(d.getDate())+" "+MON[d.getMonth()]}
function satOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return x}
function curWeek(){return fd(satOf(new Date()))}
function lastWeek(){const d=satOf(new Date());d.setDate(d.getDate()-7);return fd(d)}
function shift(w,n){const d=pd(w);d.setDate(d.getDate()+n);return fd(d)}
function toast(t){const e=$("#tt");e.textContent=t;e.classList.remove("hid");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hid"),3500)}
const ERR={bad_token:"هذا الرابط غير صحيح. تأكد أنك فتحته كاملاً كما وصلك.",revoked:"تم إيقاف هذا الرابط. تواصل مع معلم الحلقة للحصول على رابط جديد.",expired:"انتهت صلاحية هذا الرابط. تواصل مع معلم الحلقة للحصول على رابط جديد.",locked:"الرابط موقوف مؤقتاً. حاول بعد قليل.",rate_limited:"محاولات كثيرة. حاول بعد عدة دقائق.",not_your_child:"هذا الطالب غير مرتبط برابطك.",comment_rate_limited:"أرسلت تعليقات كثيرة. حاول بعد ساعة.",bad_comment:"التعليق فارغ أو أطول من ٢٠٠ حرف.",already_reacted:"أرسلت ما شاء الله من قبل ❤️"};
async function rpc(fn,body){
 const h={"Content-Type":"application/json",apikey:KEY};
 let r,j=null;const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),20000);
 try{r=await fetch(URL_+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(body),signal:ctl.signal})}catch(e){clearTimeout(tm);throw{code:"net"}}
 clearTimeout(tm);j=await r.json().catch(()=>null);
 if(!r.ok){const m=(j&&(j.message||""))+"";const k=Object.keys(ERR).find(k=>m.indexOf(k)>=0);throw{code:k||"other",status:r.status}}
 return j}
function fail(e){return e&&ERR[e.code]?ERR[e.code]:e&&e.code=="net"?"تعذّر الاتصال بالإنترنت. تأكد من الشبكة ثم أعد المحاولة.":"حدث خطأ غير متوقع. حاول مرة أخرى لاحقاً."}
function showErr(m,retry){$("#main").innerHTML='<div class="err">'+esc(m)+'</div>'+(retry?'<div class="ctr"><button class="btn" id="rt">إعادة المحاولة</button></div>':"");if(retry)$("#rt").onclick=retry}
async function init(){
 if(!TOKEN||TOKEN.length<16){showErr("افتح الرابط الخاص بك كما أرسله لك معلم الحلقة.");return}
 try{const j=await rpc("parent_login",{p_token:TOKEN});
  ST.parent=j.parent;ST.kids=j.children||[];
  $("#sub").textContent="أهلاً "+ST.parent;
  if(!ST.kids.length){$("#main").innerHTML='<div class="card">لا يوجد أبناء مرتبطون بهذا الرابط بعد. تواصل مع معلم الحلقة.</div>';return}
  ST.sid=ST.kids[0].student_id;ST.week=lastWeek();await load()}
 catch(e){showErr(fail(e),e.code=="net"||e.code=="other"?init:null)}}
async function load(){
 ST.busy=true;draw();
 try{const j=await rpc("parent_weekly",{p_token:TOKEN,p_week_start:ST.week});
  ST.reps=(j.reports||[]);ST.err="";
  const r=ST.reps.find(x=>x.student_id==ST.sid);
  if(r)await loadMine();ST.busy=false;
  if(r)rpc("parent_record_view",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week}).catch(()=>{})}
 catch(e){ST.busy=false;ST.reps=[];ST.err=fail(e)}
 draw()}
/* own reactions and comments come from the server (parent_mine), cached in memory */
let MINE={};
function mk(){return ST.sid+":"+ST.week}
function mineList(){return MINE[mk()]||[]}
async function loadMine(){const k=mk();try{const j=await rpc("parent_mine",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week});MINE[k]=j.items||[]}catch(e){MINE[k]=MINE[k]||[]}}
function dk(day){return day||null}
function hasHeart(day){return mineList().some(x=>x.kind=="mashallah"&&(x.day_date||null)==dk(day))}
function myComments(day){return mineList().filter(x=>x.kind=="comment"&&(x.day_date||null)==dk(day)).map(x=>x.comment)}
function addMine(o){const k=mk();MINE[k]=(MINE[k]||[]).concat([o])}
const STT={heard:["سمّع","ok"],not_heard:["لم يسمّع","bad"],excused:["معذور","neu"],absent:["غائب","bad"],off:["إجازة","neu"]};
function reactBox(day){
 const on=hasHeart(day),cm=myComments(day);
 return'<div class="react"><button class="heart'+(on?" on":"")+'" data-a="heart" data-d="'+esc(day||"")+'"'+(on?" disabled":"")+'>'+(on?"❤️ أرسلت ما شاء الله":"🤍 ما شاء الله")+'</button><button class="btn s" data-a="cmt" data-d="'+esc(day||"")+'">💬 تعليق</button></div>'+
 '<div id="cb-'+esc(day||"week")+'"></div>'+cm.map(c=>'<div class="sent">✔ تعليقك: '+esc(c)+'</div>').join("")}
function draw(){
 const M=$("#main");
 let h="";
 if(ST.kids.length>1)h+='<div class="chips">'+ST.kids.map(k=>'<button class="chip'+(k.student_id==ST.sid?" on":"")+'" data-a="kid" data-id="'+esc(k.student_id)+'">'+esc(k.first_name)+'</button>').join("")+'</div>';
 const kid=ST.kids.find(k=>k.student_id==ST.sid)||{};
 const we=shift(ST.week,5),canNext=ST.week<curWeek();
 h+='<div class="nav"><button class="btn s" data-a="prev" aria-label="الأسبوع السابق">‹ السابق</button><div class="mid">'+(ST.week==lastWeek()?"الأسبوع الماضي":ST.week==curWeek()?"هذا الأسبوع":"أسبوع")+'<small>'+dl(ST.week)+" – "+dl(we)+'</small></div><button class="btn s" data-a="next"'+(canNext?"":" disabled")+' aria-label="الأسبوع التالي">التالي ›</button></div>';
 if(ST.busy){M.innerHTML=h+'<div class="ctr mu">جاري التحميل...</div>';return}
 if(ST.err){M.innerHTML=h+'<div class="err">'+esc(ST.err)+'</div><div class="ctr"><button class="btn" data-a="retry">إعادة المحاولة</button></div>';return}
 const r=(ST.reps||[]).find(x=>x.student_id==ST.sid);
 if(!r){M.innerHTML=h+'<div class="card"><h3>'+esc(kid.first_name||"")+'</h3><div class="mu">لا يوجد تقرير منشور لهذا الأسبوع بعد.</div></div>';return}
 const g=r.goal_pages,a=r.achieved_pages,pct=g>0&&a!=null?Math.min(100,Math.round(a/g*100)):null;
 h+='<div class="card"><h3>'+esc(r.first_name)+'</h3><div class="mu">'+esc([r.center_name,r.halaqa_name].filter(Boolean).join(" · "))+'</div>';
 if(g>0)h+='<div style="margin-top:8px"><b>الخطة: '+nm(g)+' صفحة'+(r.goal_type?" ("+(r.goal_type=="hifz"?"حفظ":r.goal_type=="review"?"مراجعة":esc(r.goal_type))+")":"")+'</b> · <b>المنجز: '+nm(a==null?0:a)+'</b>'+(pct!=null?' ('+nm(pct)+'٪)':"")+'<div class="bar"><i style="width:'+(pct||0)+'%"></i></div></div>';
 h+='<div class="grid" style="margin-top:8px"><div class="stat"><b>'+nm(r.hifz_pages||0)+'</b><span>صفحات الحفظ</span></div><div class="stat"><b>'+nm(r.review_pages||0)+'</b><span>صفحات المراجعة</span></div><div class="stat"><b>'+nm(r.present_days||0)+'</b><span>أيام الحضور</span></div><div class="stat"><b>'+nm((r.absent_days||0)+(r.excused_days||0))+'</b><span>غياب ('+nm(r.excused_days||0)+' بعذر)</span></div></div>';
 if(r.rating!=null)h+='<div style="margin-top:8px">التقييم: <b>'+nm(r.rating)+' / ١٠</b></div>';
 if(r.upcoming_exam)h+='<div style="margin-top:6px">الاختبار القادم: <b>'+esc(r.upcoming_exam)+'</b></div>';
 if(r.teacher_note)h+='<div class="note">'+esc(r.teacher_note)+'</div>';
 h+=reactBox("")+'</div>';
 h+='<div class="card"><h3>التسميع اليومي</h3>';
 const ds=r.days||[];
 if(!ds.length)h+='<div class="mu">لا توجد أيام مسجلة.</div>';
 ds.forEach(d=>{const s=STT[d.status]||[d.status,"neu"],its=(d.items||[]);
  h+='<div class="day"><div class="dh"><b>'+DAY[pd(d.day_date).getDay()]+" "+dl(d.day_date)+'</b><span class="tag '+s[1]+'">'+esc(s[0])+'</span></div>';
  its.forEach(i=>{h+='<div class="it">'+esc(i.name||"")+(i.ay?" ("+esc(i.ay)+")":"")+(i.pages?" · "+nm(i.pages)+" صفحة":"")+(i.type=="hifz"?" · حفظ":i.type=="review"?" · مراجعة":"")+'</div>'});
  if(d.note)h+='<div class="note">'+esc(d.note)+'</div>';
  h+=reactBox(d.day_date)+'</div>'});
 h+='</div>';
 M.innerHTML=h}
document.addEventListener("click",async ev=>{
 const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
 if(a=="kid"){ST.sid=b.dataset.id;draw();load()}
 else if(a=="prev"){ST.week=shift(ST.week,-7);load()}
 else if(a=="next"){ST.week=shift(ST.week,7);load()}
 else if(a=="retry"){load()}
 else if(a=="heart"){const d=b.dataset.d||null;b.disabled=true;
  try{await rpc("parent_interact",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week,p_day_date:d,p_kind:"mashallah",p_comment:null});addMine({kind:"mashallah",day_date:d,comment:null});toast("وصلت ما شاء الله للمعلم ❤️");draw()}
  catch(e){if(e.code=="already_reacted"){addMine({kind:"mashallah",day_date:d,comment:null});draw()}else b.disabled=false;toast(fail(e))}}
 else if(a=="cmt"){const d=b.dataset.d||"",box=document.getElementById("cb-"+(d||"week"));
  if(box.firstChild){box.innerHTML="";return}
  box.innerHTML='<textarea class="cm" maxlength="200" placeholder="اكتب تعليقك (حتى ٢٠٠ حرف)"></textarea><div class="mu cnt">٠ / ٢٠٠</div><button class="btn" data-a="send" data-d="'+esc(d)+'">إرسال</button>';
  const t=box.querySelector("textarea");t.oninput=()=>{box.querySelector(".cnt").textContent=nm(t.value.length)+" / ٢٠٠"};t.focus()}
 else if(a=="send"){const d=b.dataset.d||null,box=document.getElementById("cb-"+(d||"week")),t=box.querySelector("textarea"),v=t.value.trim();
  if(!v){toast("اكتب تعليقاً أولاً");return}
  b.disabled=true;
  try{await rpc("parent_interact",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week,p_day_date:d,p_kind:"comment",p_comment:v});
   addMine({kind:"comment",day_date:d,comment:v});toast("تم إرسال تعليقك");draw()}
  catch(e){b.disabled=false;toast(fail(e))}}
});
init();
</script></body></html>
