  if(p==="granted"){const ok=await pushSync();toast(ok?"تم تفعيل التنبيهات ✅":"تعذّر تفعيل التنبيهات الآن، حاول لاحقاً")}
  else toast("لم يتم السماح بالتنبيهات")}catch(e){toast("تعذّر تفعيل التنبيهات")}
 draw()}
function pushCard(){
 const inst=(!standalone()&&deferredInstall)?'<button class="btn s" data-a="install">📲 ثبّت التطبيق</button>':"";
 if(!pushOK()){
  if(isIOS&&!standalone())return'<details class="pbar"><summary>🔔 لتصلك التنبيهات على الآيفون</summary><div class="mu">١) افتح هذا الرابط من متصفح Safari. ٢) اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية». ٣) افتح التطبيق من الشاشة الرئيسية ثم اضغط «فعّل التنبيهات». (يلزم iOS 16.4 أو أحدث)</div></details>';
  return inst?'<div class="pbar">'+inst+'</div>':""}
 const p=Notification.permission;
 if(p==="granted")return inst?'<div class="pbar"><span class="t mu">التنبيهات مفعّلة ✅</span>'+inst+'</div>':"";
 if(p==="denied")return'<details class="pbar"><summary>🔕 التنبيهات محظورة</summary><div class="mu">لتفعيلها: من إعدادات المتصفح ← إعدادات الموقع ← الإشعارات ← السماح.</div></details>';
 return'<div class="pbar"><span class="t">🔔 يصلك تنبيه عند نشر تقرير ابنك</span><button class="btn" data-a="enable">فعّل التنبيهات</button>'+inst+'</div>'}

async function loadNotes(){
 try{const j=await rpc("parent_notifications",{p_token:TOKEN});
  ST.notes=j.items||[];ST.unseen=+j.unseen||0;
  ST.newIds={};ST.notes.forEach(n=>{if(!n.seen)ST.newIds[n.id]=1});
  rpc("parent_notifications_seen",{p_token:TOKEN}).catch(()=>{})}
 catch(e){}
 bell();if(ST.view=="notes"&&ST.kids.length)draw()}
function bell(){const b=$("#bell");if(!b)return;b.classList.remove("hid");$("#bd").textContent=ST.unseen>0?nm(Math.min(ST.unseen,99)):""}
function ago(iso){const d=new Date(iso),t=new Date(),m=Math.round((t-d)/60000);if(m<1)return"الآن";if(m<60)return"قبل "+nm(m)+" دقيقة";const h=Math.round(m/60);if(h<24)return"قبل "+nm(h)+" ساعة";return nm(d.getDate())+" "+MON[d.getMonth()]}
function drawNotes(){
 let h='<div class="nav"><button class="btn s" data-a="back">رجوع ›</button><div class="mid">🔔 الإشعارات</div><span style="min-width:44px"></span></div>'+pushCard();
 if(!ST.notes.length)h+='<div class="card mu" style="text-align:center">لا توجد إشعارات بعد. سيظهر هنا كل تقرير جديد لأبنائك.</div>';
 ST.notes.forEach(n=>{const nw=ST.newIds[n.id];
  h+='<button class="nt'+(nw?" new":"")+'" data-a="note" data-sid="'+esc(n.student_id)+'" data-w="'+esc(n.week_start||"")+'"><span class="ni">📄</span><span><b>'+esc(n.title)+'</b>'+esc(n.body)+'<br><small>'+esc(ago(n.created_at))+'</small></span>'+(nw?'<span class="dot" aria-label="جديد"></span>':"")+'</button>'});
 $("#main").innerHTML=h}

function showApp(){try{if(window.AndroidBridge||!/android/i.test(navigator.userAgent)||standalone())return;const e=document.getElementById("apb");if(!e)return;const apk="https://github.com/bh6890251-lang/notes-tool/releases/latest/download/halaqa-parent.apk";const it="intent://"+location.host+location.pathname+"?k="+encodeURIComponent(TOKEN)+"#Intent;scheme=https;package=app.halaqa.parent;S.browser_fallback_url="+encodeURIComponent(apk)+";end";const st="text-decoration:none;display:inline-block;margin:4px";e.innerHTML='<b>📲 افتح تقريرك في التطبيق</b><div class="mu">لتصلك التنبيهات ويعمل بدون إنترنت.</div><a class="btn" style="'+st+'" href="'+it+'">افتح في التطبيق</a><a class="btn s" style="'+st+'" href="'+apk+'">تنزيل التطبيق</a><div class="mu">بعد التثبيت أدخل رمز الدعوة من رسالة المحفظ.</div>';e.classList.remove("hid")}catch(x){}}
function relink(){const d=document.createElement("div");d.className="ctr";d.innerHTML='<button class="btn" id="rl">🔑 إدخال رمز أو رابط جديد</button>';$("#main").appendChild(d);$("#rl").onclick=async()=>{const v=(prompt("الصق الرابط الجديد أو اكتب رمز الدعوة")||"").trim();if(!v)return;let t="";const m=/[?#&]k=([A-Za-z0-9_\-]+)/.exec(v);if(m)t=m[1];else if(v.replace(/[^A-Za-z0-9]/g,"").length<=10){try{const j=await rpc("parent_resolve_code",{p_code:v});if(j&&j.ok)t=j.token;else{toast("الرمز غير صحيح");return}}catch(e){toast(fail(e));return}}else t=v.replace(/[^A-Za-z0-9_\-]/g,"");if(t.length<16){toast("الرابط غير صحيح");return}location.hash="k="+t;location.reload()}}
async function init(){
 if(!TOKEN||TOKEN.length<16){showErr("افتح الرابط الخاص بك كما أرسله لك معلم الحلقة.");relink();return}
 try{const o=localStorage.getItem("hq_tok");if(o&&o!==TOKEN)cpurge()}catch(e){}
 try{const j=await rpc("parent_login",{p_token:TOKEN});
  try{localStorage.setItem("hq_tok",TOKEN)}catch(e){}
  ST.parent=j.parent;ST.kids=j.children||[];
  $("#sub").textContent="أهلاً "+ST.parent;showApp();
  swReg();
  if(!ST.kids.length){$("#main").innerHTML='<div class="card">لا يوجد أبناء مرتبطون بهذا الرابط بعد. تواصل مع معلم الحلقة.</div>';return}
  ST.sid=ST.kids[0].student_id;ST.week=curWeek();loadWeeks();
  loadNotes();pushSync().then(()=>{if(ST.view=="rep")draw()});
  await load()}
 catch(e){showErr(fail(e),e.code=="net"||e.code=="other"?init:null);if(["bad_token","revoked","expired"].includes(e.code))relink()}}
async function loadWeeks(){try{const j=await rpc("parent_weeks",{p_token:TOKEN});ST.weeks=(j.weeks||[]).map(String);if(ST.kids.length)draw()}catch(e){}}
function wlist(){const s={};(ST.weeks||[]).forEach(w=>s[w]=1);s[curWeek()]=1;s[ST.week]=1;return Object.keys(s).sort()}
function prevW(){const l=wlist().filter(w=>w<ST.week);return l.length?l[l.length-1]:null}
function nextW(){const l=wlist().filter(w=>w>ST.week);return l.length?l[0]:null}
async function load(){
 ST.busy=true;draw();
 try{const j=await rpc("parent_weekly",{p_token:TOKEN,p_week_start:ST.week});
  ST.reps=(j.reports||[]);ST.err="";
  const r=ST.reps.find(x=>x.student_id==ST.sid);
  ST.honor=null;
  if(r)await loadMine();try{const h=await rpc("parent_honor",{p_token:TOKEN,p_week_start:ST.week});ST.honor=h.honor||null}catch(e){}
  ST.busy=false;autoOpen();
  if(r)rpc("parent_record_view",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week}).catch(()=>{})}
 catch(e){ST.busy=false;ST.reps=[];ST.err=fail(e)}
 draw()}
/* own reactions and comments come from the server (parent_mine), cached in memory */
let MINE={};
function mk(){return ST.sid+":"+ST.week}
function mineList(){return MINE[mk()]||[]}
async function loadMine(){const k=mk();try{const j=await rpc("parent_mine",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week});MINE[k]=j.items||[]}catch(e){MINE[k]=MINE[k]||[]}}
function dk(day){return day||null}
function hasHeart(day){return mineList().some(x=>x.kind=="mashallah"&&(x.day_date||null)==dk(day))}
function myComments(day){return mineList().filter(x=>x.kind=="comment"&&(x.day_date||null)==dk(day)).map(x=>x.comment)}
function addMine(o){const k=mk();MINE[k]=(MINE[k]||[]).concat([o])}
const STT={heard:["سمّع","ok","✅"],not_heard:["لم يسمّع","bad","⚠️"],excused:["معذور","neu","📝"],absent:["غائب","bad","❌"],off:["إجازة","neu","🏖️"]};
function reactBox(day){
 const on=hasHeart(day),cm=myComments(day);
 return'<div class="react"><button class="heart'+(on?" on":"")+'" data-a="heart" data-d="'+esc(day||"")+'"'+(on?" disabled":"")+'>'+(on?"❤️ أرسلت ما شاء الله":"🤍 ما شاء الله")+'</button><button class="btn s" data-a="cmt" data-d="'+esc(day||"")+'">💬 تعليق</button></div>'+
 '<div id="cb-'+esc(day||"week")+'"></div>'+cm.map(c=>'<div class="sent">✔ تعليقك: '+esc(c)+'</div>').join("")}
function honorCard(){
 const H=ST.honor;if(!H||((H.hifz||[]).length+(H.commit||[]).length)==0)return"";
 const col=["#d9a21b","#9aa5a8","#b87333","#ddd","#ddd"];
 const lst=(L,f)=>L.map((r,i)=>'<div class="hb"><span class="rank" style="background:'+col[i]+'">'+nm(i+1)+'</span><b style="flex:1">'+esc(r.n)+'</b><small class="mu">'+f(r)+'</small></div>').join("");
 return'<details class="sc"><summary>🏆 لوحة الشرف</summary>'+
 ((H.hifz||[]).length?'<div class="mgh">🥇 الأكثر حفظاً</div>'+lst(H.hifz,r=>esc(pgf(r.h))):"")+
 ((H.commit||[]).length?'<div class="mgh">🌟 الأكثر التزاماً</div>'+lst(H.commit,r=>nm(Math.round(r.rate))+"٪ حضور · "+nm(r.t)+" أيام تسميع"):"")+'</details>'}
function top3Card(){
 const T=(ST.honor&&ST.honor.top3)||[];if(!T.length)return"";
 const md=["🥇","🥈","🥉"];
 return'<div class="sec">⭐ أفضل ٣ طلاب هذا الأسبوع</div><div class="sc top3">'+T.map((r,i)=>'<div class="tp"><span class="md">'+md[i]+'</span><div class="tn"><b>'+esc(r.n)+'</b><div class="sumrow"><span class="tag neu">📖 حفظ '+nm(r.h)+'</span><span class="tag neu">🔁 مراجعة '+nm(r.r)+'</span><span class="tag neu">✅ '+nm(r.t)+' أيام</span></div></div><div class="pt">'+nm(r.p)+'<small>نقطة</small></div></div>').join("")+
 '<div class="rule">طريقة الترتيب: كل صفحة حفظ جديد = ٢ نقطة، وكل صفحة مراجعة = نقطة، وكل يوم تسميع = نقطة. عند التساوي يُقدَّم الأعلى حفظاً ثم الأكثر التزاماً بالحضور. يشمل جميع طلاب الحلقة.</div></div>'}
function dayRow(d){
 const s=STT[d.status]||[d.status,"neu","📌"],its=(d.items||[]);
 let hp=0,rp=0;its.forEach(i=>{const p=+i.pages||0;if(i.type=="review")rp+=p;else hp+=p});
 const dt=pd(d.day_date),isT=d.day_date==fd(new Date()),op=!!ST.open[d.day_date];
 const sub=[];if(hp>0)sub.push("📖 "+pgf(hp));if(rp>0)sub.push("🔁 "+pgf(rp));
 let h='<div class="dr'+(op?" open":"")+(isT?" cur":"")+'" id="d-'+esc(d.day_date)+'"><button class="dsum" data-a="tgl" data-d="'+esc(d.day_date)+'" aria-expanded="'+op+'"><span class="dic">'+s[2]+'</span><span class="mid"><b>'+DAY[dt.getDay()]+(isT?'<span class="tg">اليوم</span>':"")+'</b><small>'+dl(d.day_date)+(sub.length?" · "+sub.join(" · "):"")+'</small></span><span class="tag '+s[1]+'">'+esc(s[0])+'</span><span class="chev">⌄</span></button>';
 if(op){h+='<div class="dbody">';
  its.forEach(i=>{const rv=i.type=="review";
   h+='<div class="itm'+(rv?" review":"")+'"><span class="ii">'+(rv?"🔁":i.type=="hifz"?"📖":"📌")+'</span><div class="ib"><b>'+esc(i.name||"")+'</b><small>'+(rv?"مراجعة":i.type=="hifz"?"حفظ جديد":"تسميع")+(i.ay?" · الآيات: "+esc(nm(i.ay)):"")+'</small></div>'+(i.pages?'<span class="pg">'+esc(pgf(i.pages))+'</span>':"")+'</div>'});
  if(!its.length&&d.status=="heard")h+='<div class="mu">لا توجد تفاصيل لهذا اليوم.</div>';
  if(!its.length&&d.status!="heard")h+='<div class="mu">لا يوجد تسميع في هذا اليوم.</div>';
  if(d.note)h+='<div class="note">📝 '+esc(d.note)+'</div>';
  h+=reactBox(d.day_date)+'</div>'}
 return h+'</div>'}
function draw(){
 const M=$("#main"),KB=$("#kb");bell();
 if(ST.view=="notes"&&ST.kids.length){KB.innerHTML="";drawNotes();return}
 KB.innerHTML=ST.kids.length>1?'<div class="chips" role="tablist">'+ST.kids.map(k=>'<button class="chip'+(k.student_id==ST.sid?" on":"")+'" role="tab" aria-selected="'+(k.student_id==ST.sid)+'" data-a="kid" data-id="'+esc(k.student_id)+'"><span class="av">'+esc(String(k.first_name||"").trim().charAt(0))+'</span>'+esc(k.first_name)+'</button>').join("")+'</div>':"";
 let h=pushCard();
 const kid=ST.kids.find(k=>k.student_id==ST.sid)||{};
 const we=shift(ST.week,5),pw=prevW(),nw=nextW();
 h+='<div class="nav"><button class="btn s" data-a="prev"'+(pw?"":" disabled")+' aria-label="الأسبوع السابق">السابق ›</button><div class="mid">'+(ST.week==curWeek()?"هذا الأسبوع":ST.week==lastWeek()?"الأسبوع الماضي":"أسبوع")+'<small>'+dl(ST.week)+" – "+dl(we)+'</small></div><button class="btn s" data-a="next"'+(nw?"":" disabled")+' aria-label="الأسبوع التالي">‹ التالي</button></div>';
 if(ST.busy){M.innerHTML=h+'<div class="ctr mu">جاري التحميل...</div>';return}
 if(ST.err){M.innerHTML=h+'<div class="err">'+esc(ST.err)+'</div><div class="ctr"><button class="btn" data-a="retry">إعادة المحاولة</button></div>';return}
 const r=(ST.reps||[]).find(x=>x.student_id==ST.sid);
 if(!r){M.innerHTML=h+'<div class="sc empty"><div class="nm">'+esc(kid.first_name||"")+'</div><div class="mu">لا يوجد تقرير منشور لهذا الأسبوع بعد.'+(pw?' يمكنك الرجوع لأسبوع سابق بزر «السابق».':"")+'</div></div>'+top3Card();return}
 const g=r.goal_pages,a=r.achieved_pages,pct=g>0&&a!=null?Math.min(100,Math.round(a/g*100)):null;
 h+='<div class="sc"><div class="nm">'+esc(r.first_name)+'</div><div class="mu">'+esc([r.center_name,r.halaqa_name].filter(Boolean).join(" · "))+'</div>';
 if(g>0)h+='<div class="plan"><b>الخطة: '+nm(g)+' صفحة'+(r.goal_type?" ("+(r.goal_type=="hifz"?"حفظ":r.goal_type=="review"?"مراجعة":esc(r.goal_type))+")":"")+'</b> · <b>المنجز: '+nm(a==null?0:a)+'</b>'+(pct!=null?' ('+nm(pct)+'٪)':"")+'<div class="bar"><i style="width:'+(pct||0)+'%"></i></div></div>';
 h+='<div class="st4"><div><b>'+nm(r.hifz_pages||0)+'</b><span>📖 حفظ</span></div><div><b>'+nm(r.review_pages||0)+'</b><span>🔁 مراجعة</span></div><div><b>'+nm(r.present_days||0)+'</b><span>✅ حضور</span></div><div><b>'+nm((r.absent_days||0)+(r.excused_days||0))+'</b><span>❌ غياب'+((r.excused_days||0)>0?' ('+nm(r.excused_days)+' بعذر)':"")+'</span></div></div>';
 const ds=(r.days||[]).slice().sort((x,y)=>x.day_date<y.day_date?1:-1),dsa=ds.slice().reverse();
 if(dsa.length)h+='<div class="wk">'+dsa.map(d=>{const s=STT[d.status]||["","neu","📌"];return'<button data-a="goto" data-d="'+esc(d.day_date)+'" aria-label="'+DAY[pd(d.day_date).getDay()]+'"><i>'+s[2]+'</i>'+DAYS[pd(d.day_date).getDay()]+'</button>'}).join("")+'</div>';
 if(r.rating!=null)h+='<div style="margin-top:10px">⭐ التقييم: <b>'+nm(r.rating)+' / ١٠</b></div>';
 if(r.upcoming_exam)h+='<div style="margin-top:6px">📝 الاختبار القادم: <b>'+esc(r.upcoming_exam)+'</b></div>';
 if(r.teacher_note)h+='<div class="note">'+esc(r.teacher_note)+'</div>';
 h+=reactBox("")+'</div>';
 h+='<div class="sec">📅 التسميع اليومي <span class="mu" style="font-weight:400;font-size:14px">(الأحدث أولاً)</span></div>';
 if(!ds.length)h+='<div class="sc mu">لا توجد أيام مسجلة.</div>';
 else h+='<div class="dl">'+ds.map(dayRow).join("")+'</div>';
 h+=top3Card();
 h+=honorCard();
 M.innerHTML=h}
function autoOpen(){
 ST.open={};const r=(ST.reps||[]).find(x=>x.student_id==ST.sid);if(!r)return;
 const ds=(r.days||[]).slice().sort((x,y)=>x.day_date<y.day_date?1:-1);
 const t=fd(new Date());let d=ds.find(x=>x.day_date==t&&x.status!="off")||ds.find(x=>x.status=="heard"||(x.items||[]).length)||ds[0];
 if(d)ST.open[d.day_date]=1}
document.addEventListener("click",async ev=>{
 const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
 if(a=="bell"){ST.view="notes";ST.unseen=0;draw();window.scrollTo(0,0)}
 else if(a=="back"){ST.view="rep";draw()}
 else if(a=="note"){const sid=b.dataset.sid,w=b.dataset.w;if(sid&&ST.kids.some(k=>k.student_id==sid))ST.sid=sid;if(w)ST.week=w;ST.view="rep";load();window.scrollTo(0,0)}
 else if(a=="enable"){enablePush()}
 else if(a=="install"){if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;ST.canInstall=false;draw()}}
 else if(a=="kid"){ST.sid=b.dataset.id;draw();load();window.scrollTo(0,0)}
 else if(a=="prev"){const w=prevW();if(w){ST.week=w;load()}}
 else if(a=="next"){const w=nextW();if(w){ST.week=w;load()}}
 else if(a=="retry"){load()}
 else if(a=="tgl"){const d=b.dataset.d;if(ST.open[d])delete ST.open[d];else ST.open[d]=1;draw()}
 else if(a=="goto"){const d=b.dataset.d;ST.open[d]=1;draw();const e=document.getElementById("d-"+d);if(e){const t=$("#top").offsetHeight+6;window.scrollTo({top:e.getBoundingClientRect().top+scrollY-t,behavior:"smooth"})}}
 else if(a=="heart"){const d=b.dataset.d||null;b.disabled=true;
  try{await rpc("parent_interact",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week,p_day_date:d,p_kind:"mashallah",p_comment:null});addMine({kind:"mashallah",day_date:d,comment:null});toast("وصلت ما شاء الله للمعلم ❤️");draw()}
  catch(e){if(e.code=="already_reacted"){addMine({kind:"mashallah",day_date:d,comment:null});draw()}else b.disabled=false;toast(fail(e))}}
 else if(a=="cmt"){const d=b.dataset.d||"",box=document.getElementById("cb-"+(d||"week"));
  if(box.firstChild){box.innerHTML="";return}
  box.innerHTML='<textarea class="cm" maxlength="200" placeholder="اكتب تعليقك (حتى ٢٠٠ حرف)"></textarea><div class="mu cnt">٠ / ٢٠٠</div><button class="btn" data-a="send" data-d="'+esc(d)+'">إرسال</button>';
  const t=box.querySelector("textarea");t.oninput=()=>{box.querySelector(".cnt").textContent=nm(t.value.length)+" / ٢٠٠"};t.focus()}
 else if(a=="send"){const d=b.dataset.d||null,box=document.getElementById("cb-"+(d||"week")),t=box.querySelector("textarea"),v=t.value.trim();
  if(!v){toast("اكتب تعليقاً أولاً");return}
  b.disabled=true;
  try{await rpc("parent_interact",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week,p_day_date:d,p_kind:"comment",p_comment:v});
   addMine({kind:"comment",day_date:d,comment:v});toast("تم إرسال تعليقك");draw()}
  catch(e){b.disabled=false;toast(fail(e))}}
});
addEventListener("online",()=>{if(OFFT||!ST.kids.length)init()});
setInterval(()=>{if(navigator.onLine!==false&&(OFFT||!ST.kids.length)&&!ST.busy)init()},60000);
init();
</script></body></html>
