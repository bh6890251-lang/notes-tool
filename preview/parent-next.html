async function monthFromWeeks(mon,sid){
 const ms=mon+"-01",me=fd(new Date(+mon.slice(0,4),+mon.slice(5)-0,0)),lo=shift(ms,-6);
 if(!(ST.weeks||[]).length){try{const j=await rpc("parent_weeks",{p_token:TOKEN});ST.weeks=(j.weeks||[]).map(String)}catch(e){}}
 const wl=(ST.weeks||[]).map(String).filter(w=>w>=lo&&w<=me);
 const T={hifz:0,review:0,present:0,absent:0,excused:0};let g=0,a=0;const rt=[];let info={};
 const RS=await Promise.all(wl.map(w=>rpc("parent_weekly",{p_token:TOKEN,p_week_start:w}).catch(()=>null)));
 for(let wi=0;wi<wl.length;wi++){const w=wl[wi],j=RS[wi];if(!j)continue;
  const r=(j.reports||[]).find(x=>x.student_id==sid);if(!r)continue;info={center_name:r.center_name,halaqa_name:r.halaqa_name,first_name:r.first_name};
  if(w>=ms&&w<=me){g+=+r.goal_pages||0;a+=+r.achieved_pages||0;if(r.rating!=null)rt.push(+r.rating)}
  (r.days||[]).forEach(d=>{if(d.day_date<ms||d.day_date>me)return;
   (d.items||[]).forEach(i=>{const p=+i.pages||0;if(i.type=="review")T.review+=p;else if(i.type=="hifz")T.hifz+=p});
   if(d.status=="heard")T.present++;else if(d.status=="absent")T.absent++;else if(d.status=="excused"||d.status=="not_heard")T.excused++})}
 return Object.assign({ok:true,month:mon,totals:T,goal_pages:g,achieved_pages:a,ratings:rt,juz_done:null,local:true},info)}

 catch(e){if(e&&e.code=="other"&&e.status==404){nfSet("parent_monthly");MD[k]=await monthFromWeeks(mon,sid)}else throw e}
 return MD[k]}

 else if(a=="install"){if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;ST.canInstall=false;draw()}}
 else if(a=="kid"){ST.sid=b.dataset.id;draw();load();if(ST.tab=="mo")loadMo();window.scrollTo(0,0)}
 else if(a=="prev"){const w=prevW();if(w){ST.week=w;load()}}
 else if(a=="next"){const w=nextW();if(w){ST.week=w;load()}}
 else if(a=="retry"){load()}
 else if(a=="tgl"){const d=b.dataset.d;if(ST.open[d])delete ST.open[d];else ST.open[d]=1;draw()}
 else if(a=="goto"){const d=b.dataset.d;ST.open[d]=1;draw();const e=document.getElementById("d-"+d);if(e){const t=$("#top").offsetHeight+6;window.scrollTo({top:e.getBoundingClientRect().top+scrollY-t,behavior:"smooth"})}}
 else if(a=="heart"){const d=b.dataset.d||null;b.disabled=true;
  if(navigator.onLine===false||OFFT){obAdd({sid:ST.sid,week:ST.week,day:d,kind:"mashallah"});addMine({kind:"mashallah",day_date:d,comment:null,pending:1});toast("حُفظت وستصل للمعلم عند عودة الإنترنت ❤️");draw();return}
  try{await rpc("parent_interact",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week,p_day_date:d,p_kind:"mashallah",p_comment:null});addMine({kind:"mashallah",day_date:d,comment:null});toast("وصلت ما شاء الله للمعلم ❤️");draw()}
  catch(e){if(e.code=="already_reacted"){addMine({kind:"mashallah",day_date:d,comment:null});draw()}else if(e.code=="net"){obAdd({sid:ST.sid,week:ST.week,day:d,kind:"mashallah"});addMine({kind:"mashallah",day_date:d,comment:null,pending:1});toast("حُفظت وستصل للمعلم عند عودة الإنترنت ❤️");draw()}else{b.disabled=false;toast(fail(e))}}}
 else if(a=="cmt"){const d=b.dataset.d||"",box=document.getElementById("cb-"+(d||"week"));
  if(box.firstChild){box.innerHTML="";return}
  box.innerHTML='<textarea class="cm" maxlength="200" placeholder="اكتب تعليقك (حتى ٢٠٠ حرف)"></textarea><div class="mu cnt">٠ / ٢٠٠</div><button class="btn" data-a="send" data-d="'+esc(d)+'">إرسال</button>';
  const t=box.querySelector("textarea");t.oninput=()=>{box.querySelector(".cnt").textContent=nm(t.value.length)+" / ٢٠٠"};t.focus()}
 else if(a=="send"){const d=b.dataset.d||null,box=document.getElementById("cb-"+(d||"week")),t=box.querySelector("textarea"),v=t.value.trim();
  if(!v){toast("اكتب تعليقاً أولاً");return}
  b.disabled=true;
  const q=()=>{obAdd({sid:ST.sid,week:ST.week,day:d,kind:"comment",comment:v});addMine({kind:"comment",day_date:d,comment:v,pending:1});toast("حُفظ تعليقك وسيصل للمعلم عند عودة الإنترنت");draw()};
  if(navigator.onLine===false||OFFT){q();return}
  try{await rpc("parent_interact",{p_token:TOKEN,p_student_id:ST.sid,p_week_start:ST.week,p_day_date:d,p_kind:"comment",p_comment:v});
   addMine({kind:"comment",day_date:d,comment:v});toast("تم إرسال تعليقك");draw()}
  catch(e){if(e.code=="net")q();else{b.disabled=false;toast(fail(e))}}}
});
addEventListener("online",()=>{if(OFFT||!ST.kids.length)init();obFlush()});
setInterval(()=>{if(navigator.onLine!==false&&(OFFT||!ST.kids.length)&&!ST.busy)init();obFlush()},60000);
init();
</script></body></html>
