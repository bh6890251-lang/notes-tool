<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إدارة الحلقة</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#1f6b4a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--g:#1f6b4a;--gd:#0f4d35;--gl:#e4f1ea;--au:#d9a21b;--aud:#7a5a0a;--bg:#f4f1e8;--cd:#fff;--tx:#1d2b24;--mu:#55655c;--bd:#d8d2bf;--rd:#b3261e;--rdl:#fbe9e7;--ok:#17733a;--sh:0 1px 3px rgba(0,0,0,.12);--ft:Tahoma,"Segoe UI",system-ui,-apple-system,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif;--qf:"Amiri","Traditional Arabic","Scheherazade New","Noto Naskh Arabic","Geeza Pro",serif}
html.dk{--g:#5fc08f;--gd:#0b1612;--gl:#1d3a2c;--au:#e8b73c;--aud:#f0cf7a;--bg:#101714;--cd:#19231e;--tx:#e8efe9;--mu:#a7b8ad;--bd:#33443b;--rd:#ff8a80;--rdl:#3a1f1c;--ok:#6fd49a;--sh:none}
@media(prefers-color-scheme:dark){html.auto{--g:#5fc08f;--gd:#0b1612;--gl:#1d3a2c;--au:#e8b73c;--aud:#f0cf7a;--bg:#101714;--cd:#19231e;--tx:#e8efe9;--mu:#a7b8ad;--bd:#33443b;--rd:#ff8a80;--rdl:#3a1f1c;--ok:#6fd49a;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--ft);padding-bottom:84px;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--au);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.hid{display:none!important}
#app{max-width:720px;margin:0 auto;padding:0 12px}
header.top{display:flex;align-items:center;gap:10px;padding:10px 4px 6px}
header.top img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#fff;padding:2px;flex:none}
header.top .t{flex:1;min-width:0}
header.top b{display:block;font-size:17px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top small{color:var(--mu);font-size:14px}
.bar{background:#fff3cf;color:#5c4300;border:1px solid #d6aa2c;border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
html.dk .bar,html.auto .bar{}
@media(prefers-color-scheme:dark){html.auto .bar{background:#3b3114;color:#f3dc8f;border-color:#8a6d1a}}
html.dk .bar{background:#3b3114;color:#f3dc8f;border-color:#8a6d1a}
.bar.err{background:var(--rdl);color:var(--rd);border-color:var(--rd)}
.bar .sp{flex:1;min-width:120px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;box-shadow:var(--sh)}
.card.ab{border-color:var(--rd);background:var(--rdl)}
.card.done{border-inline-start:5px solid var(--g)}
.card h3,.card h4{margin:0 0 6px;font-size:17px}
.mu{color:var(--mu);font-size:14px}
.sm{font-size:14px}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);font-size:16px}
textarea{min-height:88px;resize:vertical}
input[type=checkbox],input[type=radio]{width:24px;height:24px;min-height:24px;flex:none}
input[type=date],input[type=month]{text-align:right}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;min-width:44px;padding:8px 14px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.3}
html.dk .btn{color:#06210f}
@media(prefers-color-scheme:dark){html.auto .btn{color:#06210f}}
.btn.s{background:var(--gl);color:var(--g);border:1px solid var(--bd)}
html.dk .btn.s{color:var(--g)}
.btn.au{background:var(--au);color:#2a2008}
.btn.rd{background:var(--rd);color:#fff}
html.dk .btn.rd{color:#2a0805}
.btn.gh{background:transparent;color:var(--g);border:1px solid var(--g)}
.btn.w{width:100%}
.btn.ic{padding:0;width:44px}
.btn[disabled]{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:6px 14px;border-radius:22px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-weight:600;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
html.dk .chip.on{color:#06210f}
@media(prefers-color-scheme:dark){html.auto .chip.on{color:#06210f}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--cd);cursor:pointer;font-weight:600;border-inline-start:1px solid var(--bd)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--g);color:#fff}
html.dk .seg button.on{color:#06210f}
@media(prefers-color-scheme:dark){html.auto .seg button.on{color:#06210f}}
.seg button.on.ab{background:var(--rd);color:#fff}
.seg button.on.ns{background:var(--au);color:#2a2008}
nav.bot{position:fixed;bottom:0;inset-inline:0;background:var(--cd);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{min-height:60px;border:0;background:transparent;color:var(--mu);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav.bot button svg{width:24px;height:24px}
nav.bot button.on{color:var(--g)}
nav.bot button.on::after{content:"";width:28px;height:3px;border-radius:2px;background:var(--g);margin-top:1px}
.sc .sum{display:flex;align-items:center;gap:8px;min-height:48px;cursor:pointer;width:100%;border:0;background:transparent;text-align:start;padding:0}
.sc .rk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.sc .rk.ok{background:var(--g);border-color:var(--g)}
.sc .rk.ab{background:var(--rd);border-color:var(--rd)}
.sc .nmx{flex:1;min-width:0}
.sc .nmx b{display:block;font-size:17px}
.sc .nmx small{display:block;color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .bd{display:none;margin-top:8px;border-top:1px dashed var(--bd);padding-top:8px}
.sc.open .bd{display:block}
.sc .cv{transition:transform .2s;color:var(--mu)}
.sc.open .cv{transform:rotate(180deg)}
.en{border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0;background:var(--bg)}
.en .xt{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.sugg{display:flex;align-items:center;gap:8px;background:var(--gl);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px;flex-wrap:wrap}
.sugg .sp{flex:1;min-width:140px}
.pgw{margin:8px 0}
.pbar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--g);transition:width .3s}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:top}
th{background:var(--gl);font-size:14px}
.nm{font-weight:700}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--gl);color:var(--g);font-size:14px;font-weight:600;margin-inline-start:6px}
.badge.rd{background:var(--rdl);color:var(--rd)}
.text-out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:15px;line-height:1.7;max-height:320px;overflow:auto;direction:rtl}
.qbox{background:linear-gradient(135deg,#0f4d35,#1f6b4a);color:#fff;border-radius:14px;padding:14px;text-align:center}
.qbox p{font-family:var(--qf);font-size:22px;line-height:2;margin:6px 0}
.qbox small{color:#f6dd8f;font-size:14px}
.qbox .chip{min-height:44px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.qbox .chip.on{background:#f6dd8f;color:#12402c}
.ac{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.ac p{font-family:var(--qf);font-size:20px;line-height:2;margin:0 0 6px}
.ac button{width:100%;min-height:48px;border-radius:10px;border:0;background:var(--g);color:#fff;font-weight:700}
html.dk .ac button{color:#06210f}
.ac button.dn{background:var(--gl);color:var(--g)}
#toast{position:fixed;bottom:76px;inset-inline:12px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:#222;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:auto;max-width:560px;font-size:15px;animation:up .2s}
.tst button{background:transparent;border:0;color:#f6dd8f;font-weight:800;min-height:44px;padding:0 8px;cursor:pointer;font-size:16px}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#modal .mb{background:var(--cd);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}
#modal .mb h3{margin:0 0 8px}
#modal .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#modal .acts .btn{flex:1;min-width:120px}
@media(min-width:600px){#modal{align-items:center}#modal .mb{border-radius:18px}}
#lock{position:fixed;inset:0;z-index:1000;background:linear-gradient(180deg,#0f4d35,#1f6b4a);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
#lock .bx{width:100%;max-width:340px}
#lock img{height:84px;background:#fff;border-radius:16px;padding:4px}
#lock h2{margin:10px 0 4px;color:#f6dd8f;font-family:var(--qf);font-size:28px}
#lock input{text-align:center;font-size:26px;letter-spacing:10px;color:#111;background:#fff;border:0}
#lock .er{color:#ffd0c8;min-height:24px;margin-top:6px}
#lock button{margin-top:10px}
#lock .lnk{background:transparent;color:#cfe6d8;text-decoration:underline;font-weight:400}
.hb{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.rank{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#222;flex:none}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp div{background:var(--bg);border-radius:10px;padding:8px}
.kp label{margin:0;font-size:13px}
.kp b{display:block;font-size:16px}
.cc>.chd{display:flex;justify-content:space-between;align-items:center;min-height:44px;cursor:pointer;font-weight:700;border:0;background:transparent;width:100%;padding:0;text-align:start}
.cc>.cbody{display:none;margin-top:8px}
.cc.open>.cbody{display:block}
.cc.open>.chd .cv{transform:rotate(180deg)}
.empty{text-align:center;color:var(--mu);padding:20px 8px}
.wkd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wkd button{min-height:56px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);cursor:pointer;font-weight:700;line-height:1.3}
.wkd button small{display:block;font-weight:400;color:var(--mu);font-size:14px}
.wkd button.ok{border-color:var(--g);background:var(--gl)}
.wkd button.td{outline:2px solid var(--au)}
.wkd button.on{background:var(--g);color:#fff}
.wkd button.on small{color:#fff}
.cr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.cr .sp{flex:1}
.cb{width:52px;height:52px;border-radius:50%;border:2px solid var(--bd);background:var(--cd);font-size:26px;font-weight:700;cursor:pointer}
.cb.pl{background:var(--g);color:#fff;border-color:var(--g)}
.cn{min-width:32px;text-align:center;font-size:20px;font-weight:800}
.big{font-size:44px;font-weight:800;text-align:center}
.okc{color:var(--ok)}.nok{color:var(--rd)}
#prt{position:fixed;inset:0;z-index:400;background:#fff;color:#000;overflow:auto;padding:12px}
#prt .pb{display:flex;gap:8px;margin-bottom:10px}
#prt .pg{max-width:780px;margin:0 auto 20px;page-break-after:always;font-size:14px}
#prt h2{text-align:center;color:#1f6b4a;margin:4px 0}
#prt .sub{text-align:center;color:#444}
#prt .nmr{font-size:18px;font-weight:700;margin:10px 0}
#prt .kp div{background:#f3f3ea;color:#000}
#prt .kp b{font-size:16px}
#prt table th{background:#e4f1ea;color:#000}
#prt .ft{margin:10px 0;padding:8px;border:1px solid #ccc;border-radius:8px}
#prt .sg{display:flex;justify-content:space-between;margin-top:30px;font-size:14px}
@media print{body>*:not(#prt){display:none!important}#prt{position:static;padding:0}#prt .pb{display:none}}
.imgprev{max-width:100%;border-radius:10px;border:1px solid var(--bd)}
details>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.al{border-inline-start:5px solid var(--rd)}
.card .flex{align-items:center}
.mgh{font-weight:800;margin:14px 0 4px;color:var(--g)}
.star-on{color:var(--au)}
.prog{font-size:14px;font-weight:700;color:var(--g);text-align:center;margin:6px 0 2px}
.dayhead{display:flex;align-items:center;gap:6px}
.dayhead input{flex:1}
.dayhead .btn{flex:none}
.pad{height:8px}
.ordbtn{width:44px;padding:0}
#gs{position:sticky;top:0;z-index:80;background:var(--bg);margin:0 -12px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;border-bottom:1px solid var(--bd)}
#gs input{padding-inline-start:38px;border-radius:22px;min-height:44px;background:var(--cd)}
#gs .gi{position:absolute;inset-inline-start:24px;top:calc(50% + env(safe-area-inset-top)/2);transform:translateY(-50%);pointer-events:none;color:var(--mu);font-size:17px}
#gsr{position:absolute;inset-inline:12px;top:calc(100% - 2px);background:var(--cd);border:1px solid var(--bd);border-radius:12px;max-height:58vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#gsr .gsi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:8px 12px;border:0;border-bottom:1px solid var(--bd);background:transparent;text-align:start;cursor:pointer;font-weight:700}
#gsr .gsi:last-child{border-bottom:0}
#gsr .gsi small{font-weight:600;font-size:13px;white-space:nowrap}
#gsr .gsi small.y{color:var(--ok)}#gsr .gsi small.n{color:var(--mu)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.row4.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row4 label{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row4 select{padding:8px 4px;font-size:15px}
.gwr{margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd)}
.tpl-t{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;direction:rtl}
.vch{display:inline-flex;min-height:36px;padding:2px 10px;border:1px solid var(--bd);border-radius:18px;background:var(--gl);color:var(--g);font-size:13px;font-weight:600;cursor:pointer;margin:2px}
.stbtn{display:flex;gap:6px;flex:none}

input,select,textarea{min-width:0;max-width:100%}.row>*{min-width:0}

function migOldLegacy(x){ /* the old app's own in-place upgrades (pgv / scv / single-day) */
 if(!x.h){x.h={};x.h[x.dt||todayK()]=x.d||{}}
 if(x.scv!==1){Object.values(x.h||{}).forEach(day=>Object.values(day||{}).forEach(d=>{if(!d||typeof d!=="object")return;if(d.att==2)d.att=1;if(d.sc!=null&&d.sc!==""){d.sc=Math.min(10,Math.max(0,Math.round(+d.sc*2)/2))}}));x.scv=1}
 if(!(x.pgv>=3)){const vals=[];Object.values(x.h||{}).forEach(day=>Object.values(day||{}).forEach(d=>{if(d&&typeof d==="object"){if(d.pg)vals.push(+d.pg);(d.x||[]).forEach(e=>{if(e&&e.pg)vals.push(+e.pg)})}}));
  /* a file with no pgv whose page values are not small whole numbers already holds real pages: never re-convert */
  if(x.pgv==null&&vals.some(v=>!(Number.isInteger(v)&&v>=0&&v<=13)))x.pgv=3;}
 if(!(x.pgv>=3)){const L=[0,0.5,1,1.5,2,2.5,3,4,5,6,7,8,9,10],m=i=>x.pgv===2?i:(i==10?11:i==11?13:i),cv=i=>i?(L[m(+i)]||0):0,fx=d=>{if(d&&typeof d==="object"){if(d.pg)d.pg=cv(d.pg);(d.x||[]).forEach(e=>{if(e&&e.pg)e.pg=cv(e.pg)})}};Object.values(x.h||{}).forEach(day=>Object.values(day||{}).forEach(fx));x.pgv=3}

 N.hl=x.hl||N.hl;N.ws=x.ws!==false;
 if(x.dir)N.dir={h:x.dir.h||"d",r:x.dir.r||"a"};if(x.alc)N.alc={abs:x.alc.abs>=0?x.alc.abs:2,nh:x.alc.nh>=1?x.alc.nh:3};

 (x.names||[]).forEach(n=>{n=String(n);if(!(n in byName))mk(n,false)});

 /* records */
 Object.keys(x.h||{}).forEach(k=>{const day=x.h[k]||{};Object.keys(day).forEach(n=>{const r=day[n];if(!r||typeof r!=="object")return;rep.oldRecords++;rep.oldExams+=(r.t||[]).length;

  ["hp","rp","ab"].forEach(f=>{if(w[f]!=null&&w[f]!==""&&w.ovw){((N.wov[w.ovw]=N.wov[w.ovw]||{})[id]=N.wov[w.ovw][id]||{})[f]=w[f]}});
  if(w.sc!=null&&w.sc!==""&&w.scw){((N.wov[w.scw]=N.wov[w.scw]||{})[id]=N.wov[w.scw][id]||{}).sc=w.sc}});
 Object.keys(x.stars||{}).forEach(wk=>{const n=x.stars[wk];if(n)N.stars[wk]=idOf(n)});
 const sOf=id=>N.students.find(s=>s.id===id);
 Object.keys(x.ex||{}).forEach(n=>{if(x.ex[n]){if(!(n in byName))idOf(n);sOf(byName[n]).ex=String(x.ex[n])}});

/* parse a backup object (new v3 or old v1 {app:"halaqa",v:1,data}) into a new-format state */
function parseBackup(o){if(!o||typeof o!=="object")throw new Error("bad");let d=o.data&&typeof o.data==="object"?o.data:o;
 if(Array.isArray(d.names)){return{kind:"old",st:normalize(migrateOld(d)),n:d.names.length}}
 if(d.v===3&&Array.isArray(d.students)&&d.days&&typeof d.days==="object"){const st=normalize(clone(d));return{kind:"new",st,n:st.students.filter(s=>!s.arch).length}}
 throw new Error("bad")}
async function readJsonFile(f){let t;try{t=await f.text();return parseBackup(JSON.parse(t))}catch(e){await say("الملف غير صالح","لم أستطع قراءة هذا الملف كنسخة احتياطية للحلقة. تأكد أنه ملف .json محفوظ من هذا التطبيق أو من النسخة القديمة. <b>لم يتغير شيء في بياناتك.</b>");return null}}
function mapOldIds(inc){const used=new Set(),mp={};inc.students.forEach(s=>{const l=S.students.find(x=>x.name===s.name&&!used.has(x.id));if(l){used.add(l.id);mp[s.id]=l.id}});
 if(!Object.keys(mp).length)return inc;const R=id=>mp[id]||id,j=JSON.stringify(inc);const o=JSON.parse(j);
 o.students=o.students.filter(s=>!mp[s.id]);const rk=x=>{const n={};Object.keys(x||{}).forEach(k=>n[R(k)]=x[k]);return n};
 Object.keys(o.days).forEach(k=>o.days[k]=rk(o.days[k]));o.wk=rk(o.wk);Object.keys(o.wov).forEach(k=>o.wov[k]=rk(o.wov[k]));Object.keys(o.stars).forEach(k=>o.stars[k]=R(o.stars[k]));o.sp=rk(o.sp);o.jz=rk(o.jz);Object.keys(o.gwk||{}).forEach(k=>o.gwk[k]=rk(o.gwk[k]));
 /* ex-students that exist locally: keep their local profile; just remap records */
 return o}
function mergeDiff(inc){const r={ns:0,us:0,nr:0,ur:0,kr:0},ex=new Map(S.students.map(s=>[s.id,s]));
 inc.students.forEach(s=>{const l=ex.get(s.id);if(!l)r.ns++;else if((s.m||0)>(l.m||0))r.us++});
 Object.keys(inc.days).forEach(k=>Object.keys(inc.days[k]).forEach(id=>{const a=inc.days[k][id],b=rd(k,id);if(!b)r.nr++;else if((a.m||0)>(b.m||0))r.ur++;else r.kr++}));return r}
function mergeApply(inc){const ex=new Map(S.students.map(s=>[s.id,s]));
 inc.students.forEach(s=>{const l=ex.get(s.id);if(!l)S.students.push(clone(s));else if((s.m||0)>(l.m||0))Object.assign(l,clone(s))});
 Object.keys(inc.days).forEach(k=>Object.keys(inc.days[k]).forEach(id=>{const a=inc.days[k][id],b=rd(k,id);if(!b||(a.m||0)>(b.m||0)){(S.days[k]=S.days[k]||{})[id]=clone(a)}}));
 const fill=(a,b)=>Object.keys(b||{}).forEach(k=>{if(a[k]===undefined)a[k]=clone(b[k])});
 fill(S.wk,inc.wk);Object.keys(inc.wov||{}).forEach(w=>{S.wov[w]=S.wov[w]||{};fill(S.wov[w],inc.wov[w])});fill(S.stars,inc.stars);fill(S.sp,inc.sp);fill(S.jz,inc.jz);Object.keys(inc.gwk||{}).forEach(w=>{S.gwk[w]=S.gwk[w]||{};fill(S.gwk[w],inc.gwk[w])});fill(S.tpl,inc.tpl);Object.keys(inc.dm||{}).forEach(k=>{if(!S.dm[k])S.dm[k]=clone(inc.dm[k])})}

async function hpin(pin,salt){let s=salt+":"+pin;try{if(crypto&&crypto.subtle){let b=new TextEncoder().encode(s);for(let i=0;i<1500;i++)b=new Uint8Array(await crypto.subtle.digest("SHA-256",b));return"s"+Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}
 let h=5381;for(let i=0;i<20000;i++)for(let j=0;j<s.length;j++)h=((h<<5)+h+s.charCodeAt(j))>>>0;return"j"+h.toString(16)}
const pinOk=async p=>S.pin&&(await hpin(p,S.pin.salt))===S.pin.h;
